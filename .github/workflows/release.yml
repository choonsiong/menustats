# Pushing a version tag (v1.2.3) publishes the GitHub release for it:
# "v1.2.3 release", with notes GitHub generates from the pull requests
# merged since the previous release. A tag is cut from the default branch
# after each merge (the /lcsgitflow workflow).
#
# Nothing is built or attached: deploying a release is a separate step.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # A release is of what is on the default branch. "behind" or
      # "identical" means the tagged commit is its head or an ancestor.
      - name: Check the tag is on the default branch
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on $DEFAULT_BRANCH ($status)"
            exit 1
          fi

      - name: Publish the release
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG release" --generate-notes
